[smtp]
# Office365 SMTP settings
server = smtp.office365.com
port = 587
# Your Outlook email address
email =
# Leave password blank — use OUTREACH_PASSWORD env var instead

[limits]
# Max emails per day
daily_email_limit = 150
# Random throttle delay between emails (seconds)
throttle_min_seconds = 30
throttle_max_seconds = 90

[cadence]
# Days to wait before each step becomes due
step1 = 0
step2 = 2
step3 = 3
step4 = 2
step5 = 2
step6 = 4
